# ============================================
# HYPRLAND CONFIGURATION (Modular)
# ============================================
# Main entry point - sources all modular configs
# Version: 0.55.2
# System: Arch Linux + NVIDIA + Dual Monitors
# Theme: Catppuccin Mocha

# ===== ENVIRONMENT & SYSTEM =====
source = ~/.config/hypr/configs/env.conf

# ===== DISPLAY CONFIGURATION =====
source = ~/.config/hypr/configs/monitors.conf
source = ~/.config/hypr/configs/workspaces.conf

# ===== THEME =====
source = ~/.config/hypr/themes/catppuccin/themes/mocha.conf
source = ~/.config/hypr/themes/generated.conf

# ===== APPEARANCE =====
source = ~/.config/hypr/configs/input.conf
source = ~/.config/hypr/configs/tablet.conf
source = ~/.config/hypr/configs/general.conf
source = ~/.config/hypr/configs/decorations.conf
source = ~/.config/hypr/configs/animations.conf
source = ~/.config/hypr/configs/groups.conf
source = ~/.config/hypr/configs/misc.conf

# ===== WINDOW MANAGEMENT =====
source = ~/.config/hypr/configs/windowrules.conf

# ===== KEYBINDINGS =====
source = ~/.config/hypr/configs/keybinds.conf

# ===== APP HARDENING =====
source = ~/.config/hypr/configs/jellyfin.conf

# ===== AUTOSTART =====
source = ~/.config/hypr/configs/autostart.conf

# ============================================
# END OF CONFIGURATION
# ============================================
# To modify: Edit files in ~/.config/hypr/configs/
# To reload: Super+Shift+C or hyprctl reload
