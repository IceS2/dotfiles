source = ~/.config/hypr/themes/hyprlock-colors.conf

general {
  disable_loading_bar = false
  hide_cursor = true
  ignore_empty_input = true
  grace = 0
  no_fade_in = false
}

background {
  monitor =
  path = screenshot
  blur_passes = 3
  blur_size = 8
}

input-field {
  monitor =
  size = 300, 50                 # Width x Height in pixels
  outline_thickness = 2
  dots_size = 0.2                # Size of password dots (relative)
  dots_spacing = 0.35
  dots_center = true
  dots_rounding = -1             # -1 = fully rounded (circles)

  # Material You colors (from hyprlock-colors.conf)
  outer_color = $lockPrimaryRing           # Ring = primary with 93% opacity
  inner_color = $lockSurfaceInner          # Inside = surface with 50% opacity
  font_color = rgb($lockOnSurface)         # Text = on_surface
  fail_color = rgb($lockError)             # Wrong password = error
  check_color = rgb($lockSuccess)          # Correct password = success

  fade_on_empty = false
  placeholder_text = <span foreground="##$lockOnSurface">Password...</span>
  hide_input = false

  rounding = -1                  # Fully rounded corners

  position = 0, -120             # X, Y offset from center (120px above center)
  halign = center                # Horizontal align
  valign = center                # Vertical align
}

label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = $lockTertiaryText                # Tertiary with transparency
  font_size = 26
  font_family = Inter

  position = 0, 180              # 180px above center
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
  color = $lockPrimaryText                 # Primary (full opacity)
  font_size = 95                 # Large, prominent
  font_family = Maple Mono NF Bold

  position = 0, 80               # 80px above center
  halign = center
  valign = center
}

label {
  monitor =
  text = $USER                   # Your username (environment variable)
  color = $lockOnSurfaceText               # on_surface with transparency
  font_size = 18
  font_family = Inter

  position = 0, -200             # Below the input field
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:1000] ~/.config/hypr/scripts/caps-lock-indicator.sh
  color = $lockCautionText                 # Caution (warning color)
  font_size = 14
  font_family = Inter

  position = 0, -260
  halign = center
  valign = center
}
