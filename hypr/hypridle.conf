general {
  lock_cmd = pidof hyprlock || hyprlock       # Lock (avoid duplicate instances)
  # NVIDIA suspend fix: Pause Hyprland before driver suspends
  before_sleep_cmd = ~/.config/hypr/scripts/suspend-hyprland.sh suspend && loginctl lock-session
  # NVIDIA resume fix: Resume Hyprland after driver wakes + restart dead services
  after_sleep_cmd = ~/.config/hypr/scripts/suspend-hyprland.sh resume && ~/.config/hypr/scripts/resume-from-lock.sh
}

# Brightness dimming disabled - external monitors don't support brightnessctl
# (External monitor DDC/CI brightness control proved unreliable)

listener {
  timeout = 900                                # 15 minutes (900 seconds)
  on-timeout = loginctl lock-session           # Trigger lock
}

listener {
  timeout = 1200                               # 20 minutes (1200 seconds)
  on-timeout = systemctl suspend               # Suspend system to RAM (replaces DPMS)
  # Note: on-resume not needed - after_sleep_cmd handles post-resume tasks
}
