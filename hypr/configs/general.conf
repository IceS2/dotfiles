# ============================================
# GENERAL SETTINGS
# ============================================

general {
  gaps_in = 10
  gaps_out = 16
  border_size = 2

  # Material You colors (from generated.conf)
  col.active_border = $secondary $primary 45deg
  col.inactive_border = $surfaceContainer

  layout = dwindle
}

dwindle {
    preserve_split = true       # Keep split direction permanent (no surprise layout shifts)
    pseudotile = true           # Windows can keep preferred size in tiled slot
    force_split = 2             # Always split right/bottom (predictable)
    special_scale_factor = 0.9  # Scratchpad at 90% screen size
}
