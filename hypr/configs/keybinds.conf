# ============================================
# KEYBINDINGS
# ============================================

$mainMod = SUPER

# ===== APPLICATIONS =====

# Open Terminal
bind = $mainMod, Return, exec, kitty

# Launch/toggle QuickShell launcher
bind = $mainMod, Space, global, quickshell:launcher_toggle

# Toggle notification center
bind = $mainMod, N, global, quickshell:notifications_toggle

# Toggle clipboard history
bind = $mainMod SHIFT, V, global, quickshell:clipboard_toggle

# Toggle wallpaper picker
bind = $mainMod, W, global, quickshell:wallpaper_toggle

# Toggle theme mode (static Catppuccin / dynamic wallpaper)
bind = $mainMod SHIFT, T, global, quickshell:theme_toggle

# Toggle emoji picker
bind = $mainMod, E, global, quickshell:emoji_toggle


# ===== SESSION MANAGEMENT =====

# Close window
bind = $mainMod, Q, killactive,

# Power menu (lock / suspend / reboot / shutdown)
bind = $mainMod, X, global, quickshell:power_toggle

# ===== WINDOW STATES =====

# Fullscreen modes
bind = $mainMod, F, fullscreen, 1        # Maximize (keeps gaps/bar)
bind = $mainMod SHIFT, F, fullscreen, 0  # Real fullscreen

# Toggle floating
bind = $mainMod, V, togglefloating,

# Pin window (visible on all workspaces — "sticky")
bind = $mainMod, P, pin,

# Minimize/Show minimized windows
bind = $mainMod, M, movetoworkspacesilent, special:minimized  # Minimize (hide) window
bind = $mainMod SHIFT, M, togglespecialworkspace, minimized   # Show/hide minimized windows
bind = $mainMod SHIFT, U, movetoworkspacesilent, e+0           # Unminimize — move to current workspace

# Toggle opacity (make focused window opaque/transparent)
bind = $mainMod, O, setprop, active opaque toggle

# ===== WINDOW MANAGEMENT =====

# Move Focus (Super+Arrows)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Swap Windows (Super+Shift+Arrows)
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d

# Center floating window
bind = $mainMod, C, centerwindow,

# Alt+Tab window switching
bind = ALT, Tab, cyclenext,                # Alt+Tab: Next window
bind = ALT SHIFT, Tab, cyclenext, prev     # Alt+Shift+Tab: Previous window

# ===== RESIZE MODE (Submap) =====

# Enter resize mode (Super+R)
bind = $mainMod, R, submap, resize

submap = resize
  # Basic resize (20px steps)
  binde = , right, resizeactive, 20 0
  binde = , left, resizeactive, -20 0
  binde = , up, resizeactive, 0 -20
  binde = , down, resizeactive, 0 20

  # Precise resize (5px steps with Ctrl)
  binde = CTRL, right, resizeactive, 5 0
  binde = CTRL, left, resizeactive, -5 0
  binde = CTRL, up, resizeactive, 0 -5
  binde = CTRL, down, resizeactive, 0 5

  # Fast resize (100px steps with Shift)
  binde = SHIFT, right, resizeactive, 100 0
  binde = SHIFT, left, resizeactive, -100 0
  binde = SHIFT, up, resizeactive, 0 -100
  binde = SHIFT, down, resizeactive, 0 100

  # Exit resize mode
  bind = , escape, submap, reset
  bind = , return, submap, reset
  bind = $mainMod, R, submap, reset  # Toggle off with same key
submap = reset

# ===== MOUSE BINDINGS =====

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ===== SCRATCHPADS =====

# Terminal scratchpad (Super+T)
bind = $mainMod, T, togglespecialworkspace, term

# ===== WORKSPACE MANAGEMENT =====

# Switch to workspace (Super+1-9,0)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10  # Key "0" maps to workspace 10

# Move window to workspace (Super+Shift+1-9,0)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Cycle workspaces on current monitor (Super+Home/End on NAV layer)
bind = $mainMod, Home, exec, ~/.config/hypr/scripts/cycle-workspace.sh prev
bind = $mainMod, End, exec, ~/.config/hypr/scripts/cycle-workspace.sh next

# Move window to prev/next workspace on current monitor (Super+Shift+Home/End)
bind = $mainMod SHIFT, Home, exec, ~/.config/hypr/scripts/cycle-workspace.sh prev --move
bind = $mainMod SHIFT, End, exec, ~/.config/hypr/scripts/cycle-workspace.sh next --move

# Toggle workspace overview (Mission Control)
bind = $mainMod, Tab, global, quickshell:overview_toggle
bind = , mouse:276, exec, qs ipc call overview toggle

# Move current workspace to other monitor (dual monitor swap)
bind = $mainMod CTRL, left, movecurrentworkspacetomonitor, l
bind = $mainMod CTRL, right, movecurrentworkspacetomonitor, r

# Color picker (copies hex to clipboard)
bind = $mainMod, I, exec, hyprpicker -a

# ===== SCREENSHOTS =====

# Full screenshot with annotation (Print key)
bind = , Print, exec, grimblast --notify save screen - | satty --filename - --output-filename ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png

# Area screenshot with annotation (Ctrl+Print)
bind = CTRL, Print, exec, grimblast --notify save area - | satty --filename - --output-filename ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png

# Quick clipboard copy (Shift+Print)
bind = SHIFT, Print, exec, grimblast --notify copy area

# ===== MEDIA & AUDIO KEYS =====

bindel = , XF86AudioRaiseVolume, global, quickshell:osd_volume_up
bindel = , XF86AudioLowerVolume, global, quickshell:osd_volume_down
bindl = , XF86AudioMute, global, quickshell:osd_toggle_mute

# Media playback control (bindl = works during fullscreen, routed through QuickShell)
bindl = , XF86AudioPlay, global, quickshell:media_toggle_play
bindl = , XF86AudioStop, global, quickshell:media_toggle_play
bindl = , XF86AudioNext, global, quickshell:media_next
bindl = , XF86AudioPrev, global, quickshell:media_previous

# ===== SCREEN RECORDING =====

# GPU Screen Recorder overlay (ShadowPlay-style settings UI)
bind = ALT, Z, exec, gsr-ui-cli toggle-show

# Instant replay: toggle buffer on/off, save last replay
bind = $mainMod, F9, exec, gsr-ui-cli toggle-replay
bind = $mainMod, F10, exec, gsr-ui-cli replay-save
