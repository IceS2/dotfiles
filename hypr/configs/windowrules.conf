# ============================================
# WINDOW RULES
# ============================================
# Using Hyprland 0.53+ syntax with match: blocks

# ===== SCRATCHPAD STYLING =====

# Terminal scratchpad
windowrule = float on, match:class ^(scratchpad)$
windowrule = size 70% 70%, match:class ^(scratchpad)$
windowrule = center on, match:class ^(scratchpad)$
windowrule = opacity 0.95 override 0.95 override, match:class ^(scratchpad)$

# ===== GAMING RULES =====

# Stremio optimizations (no immediate, no VRR — prevents cursor freeze on paused video)
windowrule = no_blur on, match:class ^(com.stremio.stremio)$
windowrule = opacity 1.0 override 1.0 override, match:class ^(com.stremio.stremio)$
windowrule = content none, match:class ^(com.stremio.stremio)$

# Steam games - comprehensive optimizations with VRR
# Steam games use class pattern: steam_app_<APPID>

# Performance optimizations
windowrule = immediate on, match:class ^(steam_app_)
windowrule = content game, match:class ^(steam_app_)
windowrule = no_blur on, match:class ^(steam_app_)

# Visual cleanup
windowrule = border_size 0, match:class ^(steam_app_)
windowrule = rounding 0, match:class ^(steam_app_)
windowrule = opacity 1.0 override 1.0 override, match:class ^(steam_app_)

# Workspace management
windowrule = workspace 1 silent, match:class ^(steam_app_)    # Dedicated gaming workspace
windowrule = monitor DP-2, match:class ^(steam_app_)          # Always on primary monitor

# Specific game rules by title
# Guilty Gear Strive (APPID 1384160)
windowrule = monitor DP-2, match:title ^(Guilty Gear)
windowrule = workspace 1, match:title ^(Guilty Gear)
windowrule = fullscreen on, match:title ^(Guilty Gear)

# ===== LAYER RULES =====

# QuickShell - enable blur (Hyprland 0.53+ syntax)
layerrule = blur on, match:namespace quickshell-border
layerrule = ignore_alpha 0.05, match:namespace quickshell-border

layerrule = blur on, match:namespace quickshell-bar
layerrule = ignore_alpha 0.05, match:namespace quickshell-bar

# QuickShell Launcher
layerrule = blur on, match:namespace quickshell-launcher-box
layerrule = ignore_alpha 0.05, match:namespace quickshell-launcher-box

# QuickShell Notifications
layerrule = blur on, match:namespace quickshell-notification-popup
layerrule = ignore_alpha 0.05, match:namespace quickshell-notification-popup
layerrule = blur on, match:namespace quickshell-notification-center
layerrule = ignore_alpha 0.05, match:namespace quickshell-notification-center

# QuickShell Calendar
layerrule = blur on, match:namespace quickshell-calendar
layerrule = ignore_alpha 0.05, match:namespace quickshell-calendar

# QuickShell Clipboard
layerrule = blur on, match:namespace quickshell-clipboard-box
layerrule = ignore_alpha 0.05, match:namespace quickshell-clipboard-box

# QuickShell Wallpaper Picker
layerrule = blur on, match:namespace quickshell-wallpaper
layerrule = ignore_alpha 0.05, match:namespace quickshell-wallpaper

# QuickShell Overview (workspace grid)
layerrule = blur on, match:namespace quickshell-overview
layerrule = ignore_alpha 0.05, match:namespace quickshell-overview

# QuickShell Power Menu
layerrule = blur on, match:namespace quickshell-power
layerrule = ignore_alpha 0.3, match:namespace quickshell-power


# QuickShell System Tray
layerrule = blur on, match:namespace quickshell-tray-popup
layerrule = ignore_alpha 0.05, match:namespace quickshell-tray-popup
layerrule = blur on, match:namespace quickshell-tray-menu
layerrule = ignore_alpha 0.05, match:namespace quickshell-tray-menu

# QuickShell Media Player
layerrule = blur on, match:namespace quickshell-media
layerrule = ignore_alpha 0.05, match:namespace quickshell-media

# QuickShell Audio Popup
layerrule = blur on, match:namespace quickshell-audio
layerrule = ignore_alpha 0.05, match:namespace quickshell-audio

# QuickShell Network Popup
layerrule = blur on, match:namespace quickshell-network
layerrule = ignore_alpha 0.05, match:namespace quickshell-network

# QuickShell Bluetooth Popup
layerrule = blur on, match:namespace quickshell-bluetooth
layerrule = ignore_alpha 0.05, match:namespace quickshell-bluetooth

# QuickShell Performance Popup
layerrule = blur on, match:namespace quickshell-performance
layerrule = ignore_alpha 0.05, match:namespace quickshell-performance

# QuickShell Updates Popup
layerrule = blur on, match:namespace quickshell-updates
layerrule = ignore_alpha 0.05, match:namespace quickshell-updates

# QuickShell Toast (DND, volume OSD, etc.)
layerrule = blur on, match:namespace quickshell-toast
layerrule = ignore_alpha 0.05, match:namespace quickshell-toast

# QuickShell Emoji Picker
layerrule = blur on, match:namespace quickshell-emoji
layerrule = ignore_alpha 0.05, match:namespace quickshell-emoji

# ===== POLKIT AGENT =====

# Polkit authentication dialog - styled, pinned, centered
windowrule = float on, match:class ^(hyprpolkitagent)$
windowrule = center on, match:class ^(hyprpolkitagent)$
windowrule = pin on, match:class ^(hyprpolkitagent)$

# ===== UTILITY WINDOWS =====

# XWayland video bridge - hide the bridge window
windowrule = opacity 0.0 override 0.0 override, match:title ^(xwaylandvideobridge)
windowrule = size 1 1, match:title ^(xwaylandvideobridge)
windowrule = move 0 0, match:title ^(xwaylandvideobridge)
