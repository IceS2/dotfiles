# ============================================
# DECORATIONS & EFFECTS
# ============================================

decoration {
  rounding = 8
  rounding_power = 2    # Superellipse (squircle) — iOS/macOS quality corners

  # Transparency/Opacity (fully glassy aesthetic)
  active_opacity = 0.90
  inactive_opacity = 0.75
  fullscreen_opacity = 1.0

  # Subtle inactive dimming (stacks with opacity difference for extra depth)
  dim_inactive = true
  dim_strength = 0.05
  dim_special = 0.5

  blur {
    enabled = true
    size = 7
    passes = 4

    # Quality enhancements
    noise = 0.0117           # Prevent banding
    contrast = 0.9           # Slightly soft (glassy)
    brightness = 0.95        # Slightly dark (depth)
    vibrancy = 0.3           # Moderate color boost
    vibrancy_darkness = 0.6  # Richer dark colors

    # Blur popups/menus
    popups = true
    popups_ignorealpha = 0.2

    # Blur scratchpad
    special = true
  }

  # Shadow (colors from generated.conf)
  shadow {
    enabled = true
    range = 20
    render_power = 3
    color = $shadowColor
    color_inactive = $shadowColorInactive

    # Directional lighting (downward shadow)
    offset = 0 2
    scale = 1.0
  }
}
