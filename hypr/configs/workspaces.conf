# ============================================
# WORKSPACE ASSIGNMENTS
# ============================================
# Matching bspwm layout

# DP-2 (right/primary): odd workspaces
workspace = 1, monitor:DP-2, default:true
workspace = 3, monitor:DP-2
workspace = 5, monitor:DP-2
workspace = 7, monitor:DP-2
workspace = 9, monitor:DP-2

# DP-1 (left/secondary): even workspaces
workspace = 2, monitor:DP-1, default:true
workspace = 4, monitor:DP-1
workspace = 6, monitor:DP-1
workspace = 8, monitor:DP-1
workspace = 10, monitor:DP-1  # Was "0" in bspwm

# ===== SPECIAL WORKSPACES (Scratchpads) =====

# Terminal scratchpad (Super+T)
workspace = special:term, on-created-empty:kitty --class scratchpad
