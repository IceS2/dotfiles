# ============================================
# JELLYFIN DESKTOP CLIENT HARDENING
# ============================================
# The CEF/Chromium jellyfin-desktop client can hang in fullscreen during a
# playback stall and wedge the screen (frozen surface covering everything,
# forcing an alt-tab). These rules make that state recoverable.

# Emergency kill: force-quit a wedged jellyfin-desktop with Super+Shift+J.
# pkill on the binary path works even when the frozen fullscreen surface is
# covering everything and the window can't be focused/closed normally.
bind = $mainMod SHIFT, J, exec, pkill -9 -f /opt/jellyfin-desktop/jellyfin-desktop
