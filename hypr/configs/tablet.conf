# ============================================
# TABLET CONFIGURATION
# ============================================
# Wacom tablet support for drawing in Krita
#
# Setup:
#   1. Plug in tablet
#   2. Run: hyprctl devices
#   3. Copy exact tablet name from "Tablets:" section
#   4. Replace DEVICE_NAME below with your tablet's name
#   5. Save — config hot-reloads automatically
#
# Verify: hyprctl devices | grep -A2 "Tablets:"
# Debug:  sudo libinput debug-events

input {
    tablet {
        # Map tablet to main horizontal monitor
        output = DP-2

        # Absolute positioning (required for drawing)
        relative_input = false

        # Standard orientation (set true for 180° rotation)
        # NOTE: use left_handed instead of transform — transform is bugged
        left_handed = false
    }
}

# ===== PER-DEVICE MAPPING =====
device {
    name = wacom-intuos-bt-s-pen
    output = DP-2
}

# ===== ASPECT RATIO CORRECTION (optional) =====
# Your Intuos BT S is ~16:10 (152x95mm), your monitor is 16:9 (2560x1440).
# Uncomment below (and remove the basic device block above) to correct
# slight vertical stretch:
#
# device {
#     name = wacom-intuos-bt-s-pen
#     output = DP-2
#     active_area_size = 152 85.5
#     active_area_position = 0 4.75
# }
