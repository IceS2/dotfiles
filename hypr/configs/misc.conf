# ============================================
# MISC SETTINGS
# ============================================

# Cursor settings (NVIDIA fix - replaces WLR_NO_HARDWARE_CURSORS)
cursor {
  no_hardware_cursors = true
  no_break_fs_vrr = true
}

# Misc settings
misc {
  vrr = 3                        # Variable refresh rate - content-type based (game/video only)
  enable_swallow = true          # Window swallowing (terminal → GUI)
  swallow_regex = ^(kitty|wezterm)$  # Terminals that swallow
}
