# ============================================
# ENVIRONMENT VARIABLES
# ============================================
# Configured for: NVIDIA GPU, Qt6, Wayland

# ===== NVIDIA Configuration =====
# VA-API via libva-nvidia-driver (NVDEC bridge) — enables hardware
# video decode for Waterfox/Electron. mpv is pinned to hwdec=nvdec in
# mpv.conf so it uses NVDEC directly and bypasses VA-API regardless.
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = __GL_GSYNC_ALLOWED,1
env = __GL_VRR_ALLOWED,1
env = __GL_SYNC_TO_VBLANK,1

# Helps preserve OpenGL contexts across screen lock/unlock (kitty freeze fix)
env = __GL_THREADED_OPTIMIZATIONS,0

# NOTE: AQ_NO_ATOMIC was needed for Aquamarine 0.10 + NVIDIA crashes/freezes.
# Removed for Aquamarine 0.11 + Hyprland 0.55 — legacy DRM iface causes
# "Cannot commit when a page-flip is awaiting" errors → terminal flicker.
# Modern NVIDIA driver (≥555) + atomic DRM handles this properly.

# ===== Qt Theming & Platform =====
env = QT_QPA_PLATFORMTHEME,hyprqt6engine
env = QT_QPA_PLATFORM,wayland;xcb

# ===== Input Method (cedilla fix for US International) =====
# GTK on Wayland ignores ~/.XCompose by default — "simple" forces it to read it
env = GTK_IM_MODULE,simple

# ===== Cursor Theme (Catppuccin Mocha Lavender) =====
env = XCURSOR_THEME,catppuccin-mocha-lavender-cursors
env = XCURSOR_SIZE,24

# ===== Firefox/Waterfox Hardware Video Acceleration (NVIDIA) =====
env = MOZ_DRM_DEVICE,/dev/dri/renderD128
env = MOZ_DISABLE_RDD_SANDBOX,1
env = MOZ_DISABLE_GMP_SANDBOX,1
env = CUDA_DISABLE_PERF_BOOST,1

# ===== Steam / Proton Gaming =====
# PROTON_* vars are only read by Proton — no effect on non-game apps
env = PROTON_ENABLE_WAYLAND,1
env = PROTON_USE_NTSYNC,1
env = PROTON_NO_WM_DECORATION,1
env = PROTON_LOCAL_SHADER_CACHE,1
env = __GL_SHADER_DISK_CACHE_SKIP_CLEANUP,1
env = SDL_VIDEO_MINIMIZE_ON_FOCUS_LOSS,0

# ===== Rendering =====
render {
  # 2 = auto: bypass the compositor for fullscreen unoccluded clients
  # (lower input latency, tearing-free games); auto-disengages when an
  # overlay/popup appears, avoiding the glitches that motivated `false`.
  direct_scanout = 2
}

opengl {
  nvidia_anti_flicker = true
}
