# ============================================
# GROUP (TABBED WINDOWS) STYLING
# ============================================

group {
  col.border_active = $lavender $mauve 45deg
  col.border_inactive = $surface0

  groupbar {
    height = 14
    font_size = 10
    col.active = $lavender
    col.inactive = $surface0
    text_color = $text
  }
}
