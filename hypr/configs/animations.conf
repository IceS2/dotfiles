# ============================================
# ANIMATIONS
# ============================================

animations {
    enabled = true

    # ===== Bezier Curves =====
    # https://easings.net for visual reference

    # Snappy deceleration — subtle overshoot on landing (primary)
    bezier = snappy, 0.05, 0.9, 0.1, 1.05

    # MD3 expressive spatial — pronounced overshoot for entrances (end-4 style)
    bezier = expressive, 0.38, 1.21, 0.22, 1.0

    # Acceleration curve — fast start, clean exit (for closing/removing)
    bezier = close, 0.3, 0.0, 0.8, 0.15

    # Emphasized deceleration — smooth fade-ins
    bezier = decel, 0.05, 0.7, 0.1, 1.0

    # Gentle — for subtle things like fades
    bezier = gentle, 0.4, 0.0, 0.2, 1.0

    # ===== Window Animations =====
    # Open: expressive pop-in with overshoot (iOS feel)
    animation = windowsIn, 1, 3, expressive, popin 85%

    # Close: fast accelerating shrink (don't linger)
    animation = windowsOut, 1, 3, close, popin 90%

    # Move/resize: smooth repositioning with subtle overshoot
    animation = windowsMove, 1, 3, snappy, slide

    # ===== Workspace Animations =====
    # Slidefade: slide + 20% opacity crossfade (smoother than pure slide)
    animation = workspaces, 1, 3, expressive, slidefade 20%

    # Scratchpad: vertical slide (distinct from workspace switch)
    animation = specialWorkspace, 1, 3, snappy, slidevert

    # ===== Fade Animations =====
    animation = fade, 1, 3, decel
    animation = fadeIn, 1, 3, decel
    animation = fadeOut, 1, 3, gentle
    animation = fadeShadow, 1, 3, gentle
    animation = fadeDim, 1, 3, gentle

    # ===== Layer Animations =====
    # QuickShell surfaces, notifications, etc.
    animation = layers, 1, 2, snappy, fade
    animation = layersIn, 1, 2, snappy, fade
    animation = layersOut, 1, 2, close, fade
}
