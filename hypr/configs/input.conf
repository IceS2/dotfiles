# ============================================
# INPUT CONFIGURATION
# ============================================

input {
    kb_layout = us
    kb_variant = intl

    follow_mouse = 1

    # Key repeat (faster than default for snappy editing)
    repeat_rate = 35
    repeat_delay = 400

    # Mouse (flat = raw input, no acceleration — best for gaming)
    sensitivity = 0
    accel_profile = flat
}
