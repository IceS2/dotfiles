# ============================================
# AUTOSTART APPLICATIONS
# ============================================

# ===== Theme & Appearance =====
exec-once = gsettings set org.gnome.desktop.interface gtk-theme "catppuccin-mocha-lavender-standard+default"
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"

# ===== Display & Compatibility =====
# Set primary monitor for XWayland (fixes gaming resolution/focus issues)
exec-once = xrandr --output DP-2 --primary

# Expose session environment to systemd and D-Bus (needed for screen sharing, keyring, etc.)
exec-once = dbus-update-activation-environment --systemd --all

# XWayland video bridge for Discord/Zoom screen sharing
exec-once = xwaylandvideobridge

# ===== System Services =====
# Credential storage (secrets + PKCS#11, no SSH — using GPG agent for SSH)
exec-once = gnome-keyring-daemon --start --components=pkcs11,secrets

# Polkit authentication agent (GUI privilege prompts)
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent

# Launch idle daemon (screen lock, dpms)
exec-once = hypridle

# Inhibit idle (no lock/suspend) while audio is actively playing.
# Monitors PipeWire and holds a Wayland idle inhibitor whenever any app is
# playing audio to a sink (music/video) OR capturing the mic.
# NOTE: this build has no blanket "ignore mic" switch. To stop a specific
# mic-holding app (e.g. one that keeps the mic open 24/7) from inhibiting idle,
# append its exact PulseAudio application.name to a space-separated list, e.g.:
#   exec-once = sway-audio-idle-inhibit --ignore-source-outputs "Discord Chromium input"
# Find the name while the app is recording:  pactl list source-outputs | grep application.name
exec-once = sway-audio-idle-inhibit

# Wallpaper daemon (awww handles monitor reconnect natively)
exec-once = awww-daemon && ~/.config/hypr/scripts/wallpaper.sh

# ===== Clipboard =====
# Clipboard history (text and images)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ===== System Tray =====
# NetworkManager applet (--indicator = tray icon only, no window)
exec-once = nm-applet --indicator

# ===== User Interface =====
# Ensure theme configs are current before launching UI (no live reload — apps read on start)
exec-once = ~/.config/theme/apply-theme.sh --no-reload

# QuickShell (bar + launcher + notifications)
exec-once = quickshell

# Monitor watcher — restart services that lose surfaces after monitor power cycle (NVIDIA)
exec-once = ~/.config/hypr/scripts/monitor-watcher.sh
