# MangoHud Configuration
# Toggle overlay: Shift+F12

### Position & Appearance ###
position=top-right
font_size=20
background_alpha=0.3
text_color=FFFFFF
round_corners=4

### Core Metrics ###
fps
fps_color_change
frame_timing=1
frametime=1

# Advanced FPS metrics (avg, 1% low, 0.1% low)
fps_metrics=avg,0.1,0.01

### Temperature ###
cpu_temp
gpu_temp

### Usage & Load ###
cpu_stats
cpu_load_change
gpu_stats
gpu_load_change

### Memory ###
ram
vram

### Power (if supported) ###
cpu_power
gpu_power

### GPU Info ###
gpu_name
vulkan_driver
engine_version
wine
gpu_mem_clock
gpu_core_clock

### Display Info ###
resolution
refresh_rate
present_mode

### Controls ###
# Start hidden, toggle with Shift+F12
no_display
toggle_hud=Shift_R+F12

# Toggle logging
toggle_logging=Shift_L+F2

# FPS limiter toggle (cycles through limits below)
toggle_fps_limit=Shift_L+F1

# FPS limit options (cycles with Shift+F1: 165 → 144 → unlimited)
fps_limit=165,144,0

### Logging ###
# Logs are saved to this folder (for performance analysis)
output_folder=/home/ice/Documents/mangohud_logs
autostart_log=0
log_duration=0
log_interval=100

### Performance ###
# Vsync override (0=off, 1=on, -1=adaptive)
# vsync=0

# Frame timing graph
frame_timing=1
histogram=1
