# GameMode Configuration
# Optimizes system performance when games are running
# Symlinked to: /etc/gamemode.ini

[general]
; Process priority boost (niceness -10 = high priority)
renice=10

; I/O priority (0 = realtime I/O, 1 = best effort)
; Uncomment for faster asset streaming in open-world games
; ioprio=1

[gpu]
; NVIDIA GPU optimizations
; Applies maximum performance mode while gaming
apply_gpu_optimisations=accept
gpu_device=0

; AMD GPU optimizations (if you have AMD GPU)
; amd_performance_level=high

[cpu]
; CPU governor management
; desiredgov = governor to use during gaming
; default_gov = governor to revert to after gaming
;
; NOTE: this CPU uses the intel_pstate driver (active mode), which only
; exposes `performance` and `powersave` — there is NO `schedutil`/`ondemand`.
; Setting an unavailable governor makes GameMode's switch silently fail and
; leaves the CPU in powersave (slow clocks → choppy frames in CPU-bound games
; like GW2). Check with: cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_available_governors

; performance = lock to max sustained P-state while gaming (turbo still applies).
;   Right choice on a desktop (no battery); best frametime consistency.
; powersave = intel_pstate default; lets clocks dip — revert to this after gaming.

desiredgov=performance
default_gov=powersave

; CPU core pinning (advanced - Intel hybrid CPUs only)
; Pin game to high-performance cores (P-cores)
; pin_cores=1

; Park efficiency cores during gaming (E-cores)
; park_cores=0-7

[supervisor]
; Hybrid CPU configuration (Intel 12th gen+ with P-cores + E-cores)
; Separate governor for integrated GPU
; igpu_desiredgov=powersave
; igpu_power_threshold=0.3

[custom]
; Custom scripts to run on gamemode start/end
; Using QuickShell Toast instead of notify-send for consistent UI

; On game start: Show toast notification via QuickShell IPC
start=qs ipc call toast display "󰊗" "GameMode Active"

; On game exit: Show toast notification
end=qs ipc call toast display "󰊗" "GameMode Disabled"

; Alternative: Run custom script for more complex actions
; start=/home/ice/.config/hypr/scripts/gamemode-start.sh
; end=/home/ice/.config/hypr/scripts/gamemode-end.sh
