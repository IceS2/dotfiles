# Sunshine host config — Phase 1: capture physical DP-2 at native 1440p.
# See gaming/README.md "Game Streaming (Sunshine)" for setup + the one-time
# output_name step. Managed by dotfiles — edit here, not the web UI, for
# values below (the web UI rewrites this file; keep the repo copy authoritative).

# --- Capture / encode (NVIDIA + real connector) ---
encoder = nvenc
capture = kms

# Pin capture to DP-2. For the KMS backend, output_name is the POSITIONAL index
# in Sunshine's "KMS monitor list" (log order: DP-1=0, DP-2=1 on this machine —
# both cards on the same GPU, DP-1 enumerated first). Without this, auto-pick
# grabs the primary connector (DP-1) — the WRONG monitor.
# NOTE: KMS indices can drift with identical monitors across reboots/driver
# reloads (LizardByte #221/#2421). If you ever find it streaming DP-1 again,
# switch to the name-based backend:  capture = wlr  +  output_name = DP-2
output_name = 1

# --- NVENC tuning (latency-first for gaming) ---
nvenc_preset = 1              # P1 = fastest preset, lowest encode latency
nvenc_twopass = quarter_res   # cheap bitrate distribution, negligible latency
nvenc_spatial_aq = disabled   # only helps at LOW bitrate; costs latency/GPU on a high-bitrate LAN
nvenc_latency_over_power = enabled  # keep NVENC pinned to low-latency max-clock state

# --- Codec advertisement (auto-negotiate best the GPU + client support) ---
# 0 = auto. This GPU (RTX 3080, Ampere) does H.264 + HEVC via NVENC; AV1 NVENC
# needs Ada (RTX 40xx+), so av1_mode=0 simply won't advertise AV1 here — HEVC is
# the codec (enable HEVC in Moonlight on the TV). Bitrate is CLIENT-side: set it
# in Moonlight (~40-50 Mbps HEVC for 1440p60 over LAN), not here.
hevc_mode = 0
av1_mode = 0
