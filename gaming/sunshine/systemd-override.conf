# Drop-in: make Sunshine stop with the session (PartOf) and fail fast if the
# session is not up yet (Requisite), so it always starts after the autostart
# chain imports the Wayland env into the systemd user manager
# (dbus-update-activation-environment --systemd --all in hypr autostart.conf).
# Starting before that import = no capture / no audio. Race-free vs. exec-once.
# The base package unit already ships WantedBy=graphical-session.target;
# enabling the service is what pulls it into the graphical session.
[Unit]
After=graphical-session.target
PartOf=graphical-session.target
Requisite=graphical-session.target
