# ╔═══════════════════════════════════════════════════════════╗
# ║                   Keyboard Mappings                       ║
# ╚═══════════════════════════════════════════════════════════╝

#: Notes:
#: - Ctrl+Shift is the default modifier for kitty keybindings
#: - This avoids conflicts with terminal apps (vim, tmux, etc.)
#: - You can use kitty_mod to change the default modifier

kitty_mod ctrl+shift

#: Clipboard {{{
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard
map kitty_mod+s paste_from_selection
#: }}}

#: Scrolling {{{
map kitty_mod+up        scroll_line_up
map kitty_mod+down      scroll_line_down
map kitty_mod+page_up   scroll_page_up
map kitty_mod+page_down scroll_page_down
map kitty_mod+home      scroll_home
map kitty_mod+end       scroll_end

#: Scrollback pager (opens scrollback in less/nvim)
map kitty_mod+h show_scrollback
#: }}}

#: Window Management {{{
#: New window in current directory
map kitty_mod+enter new_window_with_cwd

#: Close window
map kitty_mod+w close_window

#: Next/Previous window
map kitty_mod+] next_window
map kitty_mod+[ previous_window

#: Move window forward/backward
map kitty_mod+f move_window_forward
map kitty_mod+b move_window_backward

#: Focus specific window
map kitty_mod+1 first_window
map kitty_mod+2 second_window
map kitty_mod+3 third_window
map kitty_mod+4 fourth_window
map kitty_mod+5 fifth_window
#: }}}

#: Tab Management {{{
#: New tab in current directory
map kitty_mod+t new_tab_with_cwd

#: Close tab
map kitty_mod+q close_tab

#: Next/Previous tab
map kitty_mod+right next_tab
map kitty_mod+left  previous_tab

#: Move tab forward/backward
map kitty_mod+. move_tab_forward
map kitty_mod+, move_tab_backward

#: Go to specific tab (legacy keybindings restored)
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9
map ctrl+shift+0 goto_tab 10

#: Set tab title
map kitty_mod+alt+t set_tab_title
#: }}}

#: Layout Management {{{
#: Cycle through layouts
map kitty_mod+l next_layout

#: Toggle fullscreen
map kitty_mod+f11 toggle_fullscreen
#: }}}

#: Font Size {{{
map kitty_mod+equal  change_font_size all +1.0
map kitty_mod+plus   change_font_size all +1.0
map kitty_mod+minus  change_font_size all -1.0
map kitty_mod+backspace change_font_size all 0
#: }}}

#: URL Hints {{{
#: Open URL hints (shows keyboard shortcuts for clicking URLs)
map kitty_mod+e open_url_with_hints

#: Alternative: insert selected URL into terminal
map kitty_mod+p>y kitten hints --type=hyperlink
#: }}}

#: Miscellaneous {{{
#: Reload config
map kitty_mod+f5 load_config_file

#: Edit config in $EDITOR
map kitty_mod+f2 edit_config_file

#: Debug config (shows where each setting comes from)
map kitty_mod+f6 debug_config

#: Toggle maximized
map kitty_mod+f10 toggle_maximized

#: Unicode input
map kitty_mod+u kitten unicode_input

#: Clear terminal
map kitty_mod+k clear_terminal scrollback active
#: }}}

#: Hints Kitten (Advanced) {{{
#: Select and insert file path
map kitty_mod+p>f kitten hints --type=path --program -

#: Select and insert line
map kitty_mod+p>l kitten hints --type=line --program -

#: Select and insert word
map kitty_mod+p>w kitten hints --type=word --program -

#: Select and insert hash (git commits, etc.)
map kitty_mod+p>h kitten hints --type=hash --program -
#: }}}
