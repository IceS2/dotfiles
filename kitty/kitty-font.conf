# ╔═══════════════════════════════════════════════════════════╗
# ║                    Font Configuration                     ║
# ╚═══════════════════════════════════════════════════════════╝

#: Font Family {{{
#: Choose your preferred programming font:
#: Maple Mono NF (rounded corners, smart ligatures, cursive italics)
font_family      Maple Mono NF
bold_font        Maple Mono NF Bold
italic_font      Maple Mono NF Italic
bold_italic_font Maple Mono NF Bold Italic
#: }}}

#: Font Size {{{
font_size 12.0

#: Adjust font size quickly
# Ctrl+Shift+Equal increases, Ctrl+Shift+Minus decreases
# Ctrl+Shift+Backspace resets to default
#: }}}

#: Font Features {{{
#: Enable ligatures (arrows, operators look better: -> => >= != )
disable_ligatures never

#: Alternative: disable ligatures when cursor is over them (easier editing)
# disable_ligatures cursor

#: Symbol maps for Nerd Font icons
#: Ensures icons from terminal apps display correctly
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD Maple Mono NF

#: Japanese character support (Hiragana, Katakana, Kanji)
symbol_map U+3040-U+309F,U+30A0-U+30FF,U+4E00-U+9FFF,U+3400-U+4DBF Noto Sans CJK JP
#: }}}

#: Advanced Font Settings {{{
#: Tweak if you notice rendering issues
box_drawing_scale 0.001, 1, 1.5, 2
#: }}}
