# ╔═══════════════════════════════════════════════════════════╗
# ║              Miscellaneous Configuration                  ║
# ║          (Scrollback, Tabs, Window, Cursor, Mouse)        ║
# ╚═══════════════════════════════════════════════════════════╝

#: Scrollback {{{
scrollback_lines 10000
scrollback_fill_enlarged_window yes

#: Scrollback pager (for Ctrl+Shift+H)
#: Use less for simple viewing
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

#: Advanced: Use nvim as pager for better navigation/search
# scrollback_pager nvim -c "set ft=kitty-scrollback" -

#: Store extra scrollback for pager (in MB) - doesn't use RAM until pager opens
scrollback_pager_history_size 10
#: }}}

#: URL Detection {{{
url_color #89b4fa
url_style curly
detect_urls yes

#: Open URL with hints using Ctrl+Shift+E
#: Shows keyboard shortcuts to click URLs without mouse
#: }}}

#: Window {{{
#: Initial window size (columns x rows)
remember_window_size no
initial_window_width  120c
initial_window_height 30c

#: Padding and borders
window_padding_width 4
window_border_width 0.5pt

#: Hide title bar on Wayland (Hyprland handles window decorations)
hide_window_decorations titlebar-only

#: Don't confirm when closing window with multiple tabs/processes
confirm_os_window_close 0
#: }}}

#: Tab Bar {{{
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_margin_width 0
tab_bar_margin_height 0 0

#: Tab title template - shows index and title
tab_title_template "{index}: {title}"

#: Show tab bar only when multiple tabs
tab_bar_min_tabs 2

#: Tab colors (Catppuccin Mocha)
active_tab_foreground   #11111b
active_tab_background   #cba6f7
active_tab_font_style   bold
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
inactive_tab_font_style normal

#: Bell indicator in tab title
tab_activity_symbol 🔔
#: }}}

#: Cursor {{{
cursor_shape block
cursor_blink_interval 0
cursor_stop_blinking_after 15.0
#: }}}

#: Mouse {{{
#: Hide mouse cursor after X seconds
mouse_hide_wait 2.0

#: Copy to clipboard on selection (Linux style)
copy_on_select clipboard

#: Strip trailing spaces when copying
strip_trailing_spaces smart

#: Mouse actions
#: Ctrl+Click opens URLs
open_url_with_in default

#: Click intervals (milliseconds)
click_interval 0.5
#: }}}

#: Terminal Bell {{{
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes
bell_on_tab "🔔 "
#: }}}

#: Advanced {{{
#: Allow remote control (useful for scripting kitty)
allow_remote_control yes
listen_on unix:/tmp/kitty

#: Update check (disable for privacy)
update_check_interval 0

#: Clipboard
clipboard_control write-clipboard write-primary read-clipboard read-primary
#: }}}
