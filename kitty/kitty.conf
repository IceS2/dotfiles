# ╔═══════════════════════════════════════════════════════════╗
# ║                    Kitty Configuration                    ║
# ║                     Option A: Modern                      ║
# ║   Modular config for Hyprland/Wayland with Catppuccin    ║
# ╚═══════════════════════════════════════════════════════════╝

#: Includes {{{
include kitty-font.conf
include kitty-misc.conf
include kitty-mappings.conf
include current-theme.conf
#: }}}

#: Wayland {{{
linux_display_server wayland
wayland_titlebar_color background
#: }}}

#: Performance {{{
repaint_delay 10
input_delay 3
sync_to_monitor yes
#: }}}

#: Shell Integration {{{
shell_integration enabled
#: }}}
