# Yazi Configuration

[mgr]
ratio = [1, 3, 4]          # parent, current, preview
sort_by = "mtime"          # renamed from "modified" in newer yazi
sort_reverse = true
sort_dir_first = true
linemode = "size"
show_hidden = false
show_symlink = true

[preview]
tab_size = 2
max_width = 1000
max_height = 1000
image_filter = "lanczos3"
image_quality = 90

[opener]
edit = [
  { run = 'nvim %s', block = true, for = "unix" },
]
open = [
  { run = 'xdg-open %s1', desc = "Open", for = "linux" },
]

[open]
# prepend_rules keeps yazi's preset rules (folder/image/media/archive/
# fallback) intact; these just take priority for text & code files.
prepend_rules = [
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "*/javascript", use = "edit" },
  { mime = "*/x-wine-extension-ini", use = "edit" },
]
