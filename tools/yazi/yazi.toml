# Yazi Configuration - Catppuccin Mocha Theme

[manager]
ratio = [1, 3, 4]  # Column ratios: parent, current, preview
sort_by = "modified"
sort_reverse = true
sort_dir_first = true
linemode = "size"
show_hidden = false
show_symlink = true

[preview]
tab_size = 2
max_width = 1000
max_height = 1000
image_filter = "lanczos3"
image_quality = 90

[opener]
# Open text files with nvim
edit = [
  { run = 'nvim "$@"', block = true, for = "linux" },
]
# Open images with default viewer
open = [
  { run = 'xdg-open "$@"', desc = "Open", for = "linux" },
]

[open]
rules = [
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "*/javascript", use = "edit" },
  { mime = "*/x-wine-extension-ini", use = "edit" },
  { name = "*/", use = "edit" },
  { mime = "image/*", use = "open" },
  { mime = "video/*", use = "open" },
  { mime = "audio/*", use = "open" },
  { mime = "application/pdf", use = "open" },
]
