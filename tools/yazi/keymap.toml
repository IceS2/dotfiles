# Yazi Keybindings - Arrow key navigation

[mgr]
prepend_keymap = [
  # Navigation (arrow keys)
  { on = ["<Left>"], run = "leave", desc = "Go to parent directory" },
  { on = ["<Right>"], run = "enter", desc = "Enter directory / open file" },
  { on = ["<Up>"], run = "arrow prev", desc = "Move up" },
  { on = ["<Down>"], run = "arrow next", desc = "Move down" },

  # Quick jumps
  { on = ["g", "g"], run = "arrow top", desc = "Jump to top" },
  { on = ["G"], run = "arrow bot", desc = "Jump to bottom" },

  # File operations
  { on = ["d"], run = "remove", desc = "Delete selected files" },
  { on = ["y"], run = "yank", desc = "Yank (copy) selected files" },
  { on = ["x"], run = "yank --cut", desc = "Cut selected files" },
  { on = ["p"], run = "paste", desc = "Paste files" },
  { on = ["r"], run = "rename", desc = "Rename file" },

  # Selection
  { on = ["<Space>"], run = "toggle", desc = "Toggle selection" },
  { on = ["v"], run = "visual_mode", desc = "Enter visual mode" },
  { on = ["V"], run = "visual_mode --unset", desc = "Exit visual mode" },

  # View options
  { on = ["z", "h"], run = "hidden toggle", desc = "Toggle hidden files" },
  { on = ["z", "s"], run = "sort mtime --reverse=yes", desc = "Sort by modified time" },
  { on = ["z", "n"], run = "sort natural --reverse=no", desc = "Sort by name" },

  # Quick actions
  { on = ["q"], run = "quit", desc = "Quit yazi" },
  { on = ["/"], run = "find --smart", desc = "Find files" },
  { on = ["n"], run = "find_arrow", desc = "Next match" },
  { on = ["N"], run = "find_arrow --previous", desc = "Previous match" },
]
