# Enable SSH support (unified agent for both SSH and GPG)
enable-ssh-support

# Cache passphrases for 8 hours
default-cache-ttl 28800
max-cache-ttl 28800
default-cache-ttl-ssh 28800
max-cache-ttl-ssh 28800

# Use GNOME3/GTK pinentry (more stable on Hyprland/Wayland than pinentry-qt)
pinentry-program /usr/bin/pinentry-gnome3
