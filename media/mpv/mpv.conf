# Hardware decoding (NVIDIA) — explicit nvdec so mpv uses NVDEC/CUDA
# directly and never routes through VA-API (libva-nvidia-driver is now
# enabled globally via LIBVA_DRIVER_NAME for browsers).
hwdec=nvdec
vo=gpu-next
gpu-api=vulkan

# Quality
profile=gpu-hq
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell

# OSD
osd-font=Maple Mono NF
osd-font-size=32

# Window
keep-open=yes
autofit-larger=80%x80%
cursor-autohide=1000
save-position-on-quit=yes
gpu-context=waylandvk

# Audio
volume=80
volume-max=100

# Screenshots
screenshot-format=png
screenshot-directory=~/Pictures/Screenshots
screenshot-template=%F_%P
