# Bluetooth codec configuration (WirePlumber 0.5 SPA-JSON)

monitor.bluez.properties = {
  # Enable all high-quality codecs
  bluez5.codecs = [ sbc sbc_xq aac ldac aptx aptx_hd ]

  # Enhanced SBC (SBC-XQ)
  bluez5.enable-sbc-xq = true

  # Hardware volume control
  bluez5.enable-hw-volume = true

  # Auto-connect profiles on startup
  bluez5.auto-connect = [ a2dp_sink hfp_hf hsp_hs ]
}

# Device-specific rules (high priority for Bluetooth output)
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        priority.session = 9500       # Higher than wired devices
        node.pause-on-idle = false    # Don't auto-suspend Bluetooth
        bluez5.a2dp.ldac.quality = "hq"  # Highest LDAC quality (~990kbps)
      }
    }
  }
]
