# Device priority configuration
# Sinks: max 1500 recommended, Sources: 1600-2000

monitor.alsa.rules = [
  # Arctis 7+ (highest priority)
  {
    matches = [ { node.name = "~alsa_.*Arctis.*" } ]
    actions = {
      update-props = {
        priority.driver = 1400
        priority.session = 1400
        node.pause-on-idle = false
      }
    }
  }

  # USB Audio S/PDIF (high priority for speakers)
  # Disable suspend to keep optical/TOSLINK signal alive for Yamaha SR-C20A.
  # Without this, WirePlumber closes the ALSA device after 5s idle, killing
  # the S/PDIF clock — the soundbar loses PLL lock and drops audio.
  {
    matches = [ { node.name = "~alsa_output.usb-Generic_USB_Audio.*__SPDIF__.*" } ]
    actions = {
      update-props = {
        priority.driver = 1200
        priority.session = 1200
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
        audio.allowed-rates = [ 48000 ]
        dither.noise = 2
      }
    }
  }

  # USB Audio Speakers (specific match)
  {
    matches = [ { node.name = "~alsa_output.usb-Generic_USB_Audio.*__Speaker__.*" } ]
    actions = {
      update-props = {
        priority.driver = 900
        priority.session = 900
      }
    }
  }

  # USB Audio Headphones (specific match)
  {
    matches = [ { node.name = "~alsa_output.usb-Generic_USB_Audio.*__Headphones__.*" } ]
    actions = {
      update-props = {
        priority.driver = 900
        priority.session = 900
      }
    }
  }
]
