# Lutris REGISTRATION script — PokerStars.es
#
# This deliberately has NO `files:` and NO `installer:` section. It does not
# install anything; it only registers an already-installed game in the Lutris
# library. install.sh does the real work first (verified download, prefix
# creation, client install) under system wine.
#
# Why registration-only:
#   - `installer:` is optional. Lutris only requires runner/game_name/game_slug
#     (installer/installer.py::get_errors), so a script with just a `game:`
#     section is valid.
#   - With no tasks to run, Lutris never invokes a runner during "install", so
#     it cannot silently fall back to GE-Proton/umu and build a Proton prefix.
#
# Why no `wine: version:` here either: Lutris pushes a script-specified version
# through normalize_version_architecture(), turning "system" into the
# non-existent "system-x86_64" — it aborts the install, and
# adjust_installer_runner_config() would write that broken value into the game
# config too. The runner is pinned afterwards by pin-runner.sh, at GAME level,
# where read_version_from_config() reads it verbatim.

name: PokerStars
game_slug: pokerstars
version: ES
slug: pokerstars-es
runner: wine

script:
  game:
    arch: win64
    exe: drive_c/Program Files (x86)/PokerStars.ES/PokerStars.exe
    prefix: /home/ice/Games/pokerstars

  system:
    env:
      WINEDEBUG: -all
